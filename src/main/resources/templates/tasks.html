```html
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo Application</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <!-- Heading -->
    <h1 class="text-center mb-4">Todo Application</h1>

    <!-- Add Task Form -->
    <div class="card shadow-sm p-4 mb-4">

        <form action="/" method="post">

            <div class="input-group">
                <input type="text"
                       name="title"
                       class="form-control"
                       placeholder="Add a new task..."
                       required>

                <button type="submit" class="btn btn-primary">
                    Add Task
                </button>
            </div>

        </form>

    </div>

    <!-- Task List -->
    <div class="card shadow-sm p-4">

        <h4 class="mb-3">My Tasks</h4>

        <!-- Message when there are no tasks -->
        <p th:if="${#lists.isEmpty(tasks)}"
           class="text-muted text-center">
            No tasks yet. Add your first task!
        </p>

        <!-- Display Tasks -->
        <th:block th:each="task : ${tasks}">

            <div class="d-flex flex-wrap align-items-center
                        justify-content-between gap-3
                        border rounded p-3 mb-2 bg-white">

                <!-- Task Title and Status -->
                <div class="flex-grow-1">

                    <span th:text="${task.title}"
                          th:classappend="${task.completed}
                              ? ' text-decoration-line-through text-muted'
                              : ''">
                        Task title
                    </span>

                    <div>
                        <small th:if="${task.completed}"
                               class="text-success">
                            Completed
                        </small>

                        <small th:unless="${task.completed}"
                               class="text-secondary">
                            Pending
                        </small>
                    </div>

                </div>

                <!-- Toggle and Delete Buttons -->
                <div class="d-flex gap-2">

                    <!-- Toggle Completion -->
                    <form th:action="@{/{id}/toggle(id=${task.id})}"
                          method="get">

                        <button type="submit"
                                class="btn btn-sm"
                                th:classappend="${task.completed}
                                    ? ' btn-success'
                                    : ' btn-outline-success'"
                                th:text="${task.completed}
                                    ? 'Undo'
                                    : 'Complete'">
                            Complete
                        </button>

                    </form>

                    <!-- Delete Task -->
                    <form th:action="@{/{id}/delete(id=${task.id})}"
                          method="get"
                          onsubmit="return confirm('Are you sure you want to delete this task?');">

                        <button type="submit"
                                class="btn btn-sm btn-danger">
                            Delete
                        </button>

                    </form>

                </div>

            </div>

        </th:block>

    </div>

</div>

</body>
</html>
```
